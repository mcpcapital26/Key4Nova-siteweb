# Publishes the site to GitHub Pages on every push to main.
# Pages serves this repository from a folder (/Key4Nova-siteweb/), while the pages link from the
# site root (/styles.css, /offres/): the build adds that folder to the links, and publishes only the
# public files (not scripts/, qa/, preview.html or the README). On a custom domain the folder is
# empty and the links stay as they are.
# Requires Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python3 scripts/build_pages.py _site "$BASE_PATH"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
