<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Key4Nova — présentation du nouveau site</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{display:block;border:0;width:100%;height:100%;background:#fff}</style>
</head><body>
<iframe id="preview" title="Présentation du site Key4Nova"></iframe>
<noscript>Activez JavaScript pour parcourir cette présentation du site.</noscript>
<script type="application/json" id="site-data">__SITE_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('site-data').textContent);
const frame=document.getElementById('preview');
const routingScript=`<script>document.addEventListener('click',function(event){const a=event.target.closest('a[href]');if(!a)return;const target=a.getAttribute('href');if(target&&target.startsWith('/')){event.preventDefault();parent.postMessage({type:'key4nova-route',target:target},'*')}});<\/script>`;
function render(){
  const target=decodeURI(location.hash.slice(1)||'/');
  const route=target.split('#')[0]||'/';
  const anchor=target.includes('#')?target.split('#').slice(1).join('#'):'';
  let html=data.pages[route]||data.pages['/'];
  html=html.replace(/<link rel="stylesheet" href="\/styles\.css[^\"]*">/,()=>'<style>'+data.css+'</style>')
    .replace(/<script src="\/site\.js[^\"]*" defer><\/script>/,()=>'<script>'+data.js+'<\/script>')
    .replace(/(src|href)="(\/assets\/[^\"]+)"/g,(_,attr,path)=>attr+'="'+(data.assets[path]||path)+'"')
    .replace('</body>',()=>routingScript+'</body>');
  frame.onload=()=>{if(anchor){const element=frame.contentDocument.getElementById(anchor);if(element)element.scrollIntoView()}else frame.contentWindow.scrollTo(0,0)};
  frame.srcdoc=html;
  const title=(html.match(/<title>(.*?)<\/title>/)||[])[1];
  document.title=(title||'Key4Nova').replace(/&amp;/g,'&');
}
window.addEventListener('message',event=>{
  if(event.source!==frame.contentWindow||event.data?.type!=='key4nova-route')return;
  const target=event.data.target;
  if(!/^\/[a-zA-Z0-9\/#-]*$/.test(target))return;
  const hash='#'+target;
  if(location.hash===hash)render();else location.hash=hash;
});
window.addEventListener('hashchange',render);
render();
</script></body></html>
